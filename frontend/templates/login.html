<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ავტორიზაცია | {{ app_name }}</title>
    <link href="https://fonts.googleapis.com/css2?family=FiraGO:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="auth-body">
    <div class="auth-card">
        <div class="auth-header">
            <div class="logo-circle">💨</div>
            <h2>{{ app_name }}</h2>
            <p>სამართავი პანელი & Mini App</p>
        </div>

        <form id="loginForm" class="auth-form">
            <div id="loginError" class="alert-error" style="display: none;"></div>

            <div class="form-group">
                <label for="username">მომხმარებლის სახელი</label>
                <input type="text" id="username" name="username" placeholder="მაგ: admin" required autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">პაროლი</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
            </div>

            <button type="submit" id="loginBtn" class="btn btn-primary btn-block">
                <span>შესვლა</span>
            </button>
        </form>

        <div class="auth-footer">
            <small>Default: admin / admin123</small>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const errBox = document.getElementById('loginError');
            errBox.style.display = 'none';
            btn.disabled = true;
            btn.innerHTML = 'მოწმდება...';

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (!res.ok) {
                    throw new Error(data.detail || 'ავტორიზაცია ვერ მოხერხდა');
                }
                localStorage.setItem('auth_token', data.access_token);
                localStorage.setItem('user_role', data.role);
                localStorage.setItem('username', data.username);
                window.location.href = '/admin';
            } catch (err) {
                errBox.innerText = err.message;
                errBox.style.display = 'block';
                btn.disabled = false;
                btn.innerHTML = '<span>შესვლა</span>';
            }
        });
    </script>
</body>
</html>
